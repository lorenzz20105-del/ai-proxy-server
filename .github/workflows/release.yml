name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - working-directory: backend
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - working-directory: frontend
        run: npm run build

      - name: Package source
        run: |
          # tar --append cannot update a compressed archive, so build the tar
          # uncompressed, splice the built dashboard in, then gzip.
          git archive --format=tar --prefix=aiproxy/ -o dist.tar HEAD
          tar --append --file=dist.tar --transform='s,^frontend/dist,aiproxy/frontend/dist,' frontend/dist
          gzip -9 dist.tar

      - uses: actions/upload-artifact@v4
        with:
          name: aiproxy-source
          path: dist.tar.gz
