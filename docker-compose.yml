services:
  aiproxy:
    build: .
    image: aiproxy:3.0.1
    container_name: aiproxy
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PROXY_DATA_DIR: /data
    volumes:
      - aiproxy-data:/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  aiproxy-data:
